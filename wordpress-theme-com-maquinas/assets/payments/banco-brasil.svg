<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <defs>
    <style>
      .bb-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <!-- Background Card -->
  <rect x="1" y="1" width="258" height="68" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- BB Iconic Monogram with Yellow Shield Background -->
  <rect x="14" y="15" width="40" height="40" rx="6" fill="#FCDB00"/>
  <g transform="translate(19, 20) scale(0.62)">
    <!-- Intertwined angled loops of BB -->
    <path d="M 12 4 L 36 28 L 28 36 L 4 12 Z" fill="#003882"/>
    <path d="M 36 12 L 12 36 L 20 44 L 44 20 Z" fill="#003882"/>
    <path d="M 22 2 L 2 22 L 8 28 L 28 8 Z" fill="#003882"/>
    <path d="M 46 26 L 26 46 L 20 40 L 40 20 Z" fill="#003882"/>
  </g>

  <!-- Banco do Brasil Corporate Typography -->
  <text x="64" y="33" class="bb-text" font-size="14.5" font-weight="900" fill="#003882" letter-spacing="0.2">BANCO DO BRASIL</text>
  <text x="64" y="49" class="bb-text" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.2">Transferência &amp; Depósito</text>
</svg>
